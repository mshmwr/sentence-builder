name: Daily CNN sentences

on:
  schedule:
    # 20:00 UTC = 04:00 GMT+8.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-cnn-sentences

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/fetch-cnn-sentences.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/daily-sentences.json; then
            echo "No change — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/daily-sentences.json
          git commit -m "chore: daily CNN sentences $(date -u +%F)"
          git push origin "HEAD:${{ github.ref_name }}"
